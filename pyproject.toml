[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorrt-edgellm"
dynamic = ["version"]
description = "A Python package for quantizing and exporting LLMs for edge deployment"
readme = "README.md"
keywords = [
    "nvidia",
    "tensorrt",
    "deeplearning",
    "inference",
    "edge",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "torch==2.13.0",
    "transformers==5.14.1",
    "onnx==1.19.0",
    "onnxscript==0.7.1",
    "safetensors==0.8.0",
    "numpy==2.2.6",
    "onnx-graphsurgeon==0.6.1",
]

[project.optional-dependencies]
tools = [
    "nvidia-modelopt==0.45.0",
    "datasets==5.0.0",
    "tqdm==4.69.0",
    "einops==0.8.2",
    "peft==0.19.1",
    "soundfile==0.14.0",
    "librosa==0.11.0",
    "tiktoken==0.13.0",
    "torchvision==0.28.0",
    "backoff",
]
server = [
    "fastapi==0.139.2",
    "pybind11==3.0.4",
    "uvicorn==0.51.0",
    "av==17.1.0",
    "python-multipart==0.0.32",
]
dev = []

[project.scripts]
tensorrt-edgellm-quantize = "tensorrt_edgellm.scripts.quantize:main"
tensorrt-edgellm-export = "tensorrt_edgellm.scripts.export:main"
tensorrt-edgellm-build = "experimental.builder.cli:main"
tensorrt-edgellm-insert-lora = "tensorrt_edgellm.scripts.insert_lora:main"
tensorrt-edgellm-process-lora = "tensorrt_edgellm.scripts.process_lora_weights:main"
tensorrt-edgellm-merge-lora = "tensorrt_edgellm.scripts.merge_lora:main"
tensorrt-edgellm-reduce-vocab = "tensorrt_edgellm.scripts.reduce_vocab:main"

[tool.isort]
known_third_party = ["onnx", "onnx_graphsurgeon", "onnxscript"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tensorrt_edgellm*", "experimental*"]

[tool.setuptools.package-data]
tensorrt_edgellm = ["README.md"]
"tensorrt_edgellm.chat_templates" = ["*.json"]

[tool.setuptools.dynamic]
version = {attr = "tensorrt_edgellm._version.__version__"}
